name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npx vitest run --maxWorkers=4
      - run: npm run build
      - run: npm run pack:check
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
